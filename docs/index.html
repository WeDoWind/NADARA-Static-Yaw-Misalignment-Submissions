<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NADARA Yaw Misalignment Challenge — Leaderboard</title>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .rank-badge { width:48px; height:48px; display:flex; align-items:center; justify-content:center; font-size:1.5rem; }
        .loading-spinner { border:3px solid #374151; border-top:3px solid #3b82f6; border-radius:50%; width:40px; height:40px; animation:spin 1s linear infinite; }
        @keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
        @media (prefers-reduced-motion: reduce) {
            .fade-in { animation: none; }
            .loading-spinner { animation-duration: 3s; }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-900 to-gray-800 min-h-screen p-4 md:p-8">
<div class="max-w-6xl mx-auto">

    <!-- Header -->
    <div class="text-center mb-8">
        <h1 class="text-4xl font-bold text-white mb-2">NADARA Yaw Misalignment Challenge</h1>
        <p class="text-gray-300 text-lg">Leaderboard</p>
        <div id="lastUpdate" class="text-sm text-gray-400 mt-2"></div>
    </div>

    <!-- Metric tabs -->
    <div class="flex mb-6 border-b border-gray-600">
        <button id="tab-rmse" onclick="showTab('rmse')"
            class="px-6 py-3 text-white font-semibold border-b-2 border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500 rounded-t">
            Model Performance (RMSE)
        </button>
        <button id="tab-mae" onclick="showTab('mae')"
            class="px-6 py-3 text-gray-400 font-semibold border-b-2 border-transparent focus:outline-none focus:ring-2 focus:ring-blue-500 rounded-t hover:text-white">
            Model Performance (MAE)
        </button>
    </div>

    <!-- Filters -->
    <div class="mb-6 bg-gray-800 rounded-lg shadow-md p-4 space-y-4">

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label for="filterParticipant" class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">
                    Participant ID
                </label>
                <input type="text" id="filterParticipant" placeholder="e.g. 23, 24, 25 or 23-25"
                    class="w-full px-3 py-2 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-700 text-white placeholder-gray-500"/>
            </div>
            <div>
                <label for="filterTier" class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">
                    Tier
                </label>
                <input type="text" id="filterTier" placeholder="U, C, S"
                    class="w-full px-3 py-2 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-700 text-white placeholder-gray-500"/>
            </div>
            <div>
                <label for="filterSub" class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">
                    Submission #
                </label>
                <input type="text" id="filterSub" placeholder="e.g. 0, 1, 2 or 0-3"
                    class="w-full px-3 py-2 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-700 text-white placeholder-gray-500"/>
            </div>
        </div>

        <div class="flex flex-wrap items-center gap-x-6 gap-y-3">

            <!-- Split toggle -->
            <div class="flex items-center gap-2">
                <span class="text-xs font-semibold uppercase tracking-wider text-gray-400">Split</span>
                <div class="inline-flex rounded-lg border border-gray-600 overflow-hidden">
                    <button id="split-validate" onclick="setSplit('validate')"
                        class="px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-inset focus:ring-blue-500">Validate</button>
                    <button id="split-final" onclick="setSplit('final')"
                        class="px-3 py-1.5 text-sm border-l border-gray-600 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-blue-500">Final</button>
                </div>
            </div>

            <!-- Best / all toggle -->
            <div class="flex items-center gap-2">
                <span class="text-xs font-semibold uppercase tracking-wider text-gray-400">Show</span>
                <div class="inline-flex rounded-lg border border-gray-600 overflow-hidden">
                    <button id="scope-best" onclick="setScope('best')"
                        class="px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-inset focus:ring-blue-500">Best only</button>
                    <button id="scope-all" onclick="setScope('all')"
                        class="px-3 py-1.5 text-sm border-l border-gray-600 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-blue-500">All submissions</button>
                </div>
            </div>

            <button onclick="clearFilters()"
                class="px-3 py-1.5 text-sm text-gray-300 border border-gray-600 rounded-lg hover:text-white hover:border-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500">
                Clear filters
            </button>

            <div id="filterCount" class="text-sm text-gray-400 ml-auto"></div>
        </div>
    </div>

    <!-- Loading -->
    <div id="loading" class="flex justify-center items-center py-20">
        <div class="loading-spinner"></div>
    </div>

    <!-- Error -->
    <div id="error" class="hidden bg-red-900 border border-red-600 text-red-200 px-4 py-3 rounded-lg mb-6">
        <strong>Error:</strong> <span id="errorMessage"></span>
    </div>

    <!-- Leaderboard -->
    <div id="board" class="space-y-3"></div>

    <!-- Stats -->
    <div id="stats" class="mt-8 grid grid-cols-2 md:grid-cols-4 gap-4"></div>
</div>

<script>
const BASE = 'https://wedowind.github.io/NADARA-Static-Yaw-Misalignment-Submissions/';
const SPLIT_URLS = {
    validate: BASE + 'rmse_ranking.csv',
    final:    BASE + 'rmse_ranking_final.csv',
};

// Rows per split. `final` stays an empty array until final submissions exist.
let data = { validate: [], final: [] };
let splitLoaded = { validate: false, final: false };

let currentMetric = 'rmse';   // 'rmse' | 'mae'
let currentSplit  = 'validate';
let currentScope  = 'best';   // 'best' | 'all'

const TIER_LABELS = { U: 'Unsupervised', C: 'Calibrated', S: 'Supervised' };
const TIER_COLORS = {
    U: 'bg-emerald-900 text-emerald-200',
    C: 'bg-blue-900 text-blue-200',
    S: 'bg-purple-900 text-purple-200',
};

const METRIC_LABELS = { rmse: 'RMSE (°)', mae: 'MAE (°)' };
const METRIC_COLORS = { rmse: 'text-orange-400', mae: 'text-cyan-400' };

function tierBadge(tier) {
    const cls = TIER_COLORS[tier] || 'bg-gray-700 text-gray-200';
    const label = TIER_LABELS[tier] || tier;
    return `<span class="inline-block ${cls} px-2 py-1 rounded text-xs font-medium">${label}</span>`;
}

function fmt(v, decimals) { return isNaN(v) ? '—' : parseFloat(v).toFixed(decimals); }

function cardBg(rank) {
    return rank <= 3
        ? 'bg-gradient-to-r from-yellow-900/20 to-orange-900/20 border-yellow-600'
        : 'bg-gray-800 border-gray-700';
}
function medal(rank) {
    return rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : String(rank);
}
function medalSize(rank) {
    return rank <= 3 ? 'text-4xl' : 'text-2xl font-bold text-gray-500';
}

/* ---------------------------------------------------------------------------
   Filter parsing

   Each box accepts a comma-separated list. Numeric entries may also be given
   as an inclusive range ("23-25"). Matching is exact and case-insensitive, so
   tier "C" does not also match "C3" — use "C3" if that is what you want.
--------------------------------------------------------------------------- */
function parseFilter(raw) {
    const terms = raw.split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
    if (!terms.length) return null;

    const exact  = new Set();
    const ranges = [];
    for (const t of terms) {
        const m = t.match(/^(\d+)\s*-\s*(\d+)$/);
        if (m) {
            const lo = Math.min(+m[1], +m[2]);
            const hi = Math.max(+m[1], +m[2]);
            ranges.push([lo, hi]);
        } else {
            exact.add(t);
        }
    }
    return { exact, ranges };
}

function matchesFilter(value, filter) {
    if (!filter) return true;
    const v = String(value ?? '').trim().toLowerCase();
    if (filter.exact.has(v)) return true;
    if (filter.ranges.length) {
        const n = Number(v);
        if (Number.isFinite(n) && v !== '') {
            return filter.ranges.some(([lo, hi]) => n >= lo && n <= hi);
        }
    }
    return false;
}

function activeFilters() {
    return {
        participant: parseFilter(document.getElementById('filterParticipant').value),
        tier:        parseFilter(document.getElementById('filterTier').value),
        sub:         parseFilter(document.getElementById('filterSub').value),
    };
}

/* ---------------------------------------------------------------------------
   Row selection: filter -> optionally reduce to each participant's best row
   for the ACTIVE metric -> sort -> assign display rank.
--------------------------------------------------------------------------- */
function visibleRows() {
    const f = activeFilters();
    let rows = data[currentSplit].filter(r =>
        matchesFilter(r.participant_id, f.participant) &&
        matchesFilter(r.tier,           f.tier) &&
        matchesFilter(r.sub_num,        f.sub)
    );

    if (currentScope === 'best') {
        const bestByParticipant = new Map();
        for (const r of rows) {
            const key  = String(r.participant_id);
            const prev = bestByParticipant.get(key);
            if (!prev || parseFloat(r[currentMetric]) < parseFloat(prev[currentMetric])) {
                bestByParticipant.set(key, r);
            }
        }
        rows = [...bestByParticipant.values()];
    }

    rows.sort((a, b) => parseFloat(a[currentMetric]) - parseFloat(b[currentMetric]));
    return rows.map((r, i) => ({ ...r, displayRank: i + 1 }));
}

function renderBoard(rows) {
    if (!splitLoaded[currentSplit]) {
        return '<div class="bg-gray-800 rounded-lg p-8 text-center text-gray-400">Loading…</div>';
    }
    if (!data[currentSplit].length) {
        const msg = currentSplit === 'final'
            ? 'No final submissions scored yet.'
            : 'No submissions yet.';
        return `<div class="bg-gray-800 rounded-lg p-8 text-center text-gray-400">${msg}</div>`;
    }
    if (!rows.length) {
        return '<div class="bg-gray-800 rounded-lg p-8 text-center text-gray-400">No submissions match these filters.</div>';
    }

    const other = currentMetric === 'rmse' ? 'mae' : 'rmse';
    return rows.map((row, i) => {
        const rank = row.displayRank;
        return `
        <div class="fade-in ${cardBg(rank)} rounded-lg shadow-md border-2 p-5 hover:shadow-xl transition-all" style="animation-delay:${Math.min(i, 20)*0.05}s">
          <div class="flex items-center justify-between flex-wrap gap-4">
            <div class="rank-badge ${medalSize(rank)}">${medal(rank)}</div>
            <div class="flex-1 min-w-0 mx-4">
              <div class="text-xl font-bold text-white">Participant ${row.participant_id}</div>
              <div class="mt-1 flex flex-wrap gap-2">
                ${tierBadge(row.tier)}
                <span class="inline-block bg-gray-700 text-gray-300 px-2 py-1 rounded text-xs">Sub #${row.sub_num}</span>
                ${row.tier === 'C' && parseInt(row.n_reference_turbines) > 0 ? `<span class="inline-block bg-gray-700 text-gray-300 px-2 py-1 rounded text-xs">${row.n_reference_turbines} ref turbines</span>` : ''}
              </div>
            </div>
            <div class="flex items-center gap-8 text-right">
              <div>
                <div class="text-3xl font-mono font-bold ${rank <= 3 ? METRIC_COLORS[currentMetric] : 'text-gray-300'}">${fmt(row[currentMetric], 4)}</div>
                <div class="text-xs text-gray-400 uppercase tracking-wider mt-1">${METRIC_LABELS[currentMetric]}</div>
              </div>
              <div>
                <div class="text-3xl font-mono font-bold text-gray-400">${fmt(row[other], 4)}</div>
                <div class="text-xs text-gray-400 uppercase tracking-wider mt-1">${METRIC_LABELS[other]}</div>
              </div>
            </div>
          </div>
        </div>`;
    }).join('');
}

function renderStats(rows) {
    const participants = new Set(rows.map(r => r.participant_id)).size;
    const other = currentMetric === 'rmse' ? 'mae' : 'rmse';
    const best = rows.length ? rows[0] : null;

    document.getElementById('stats').innerHTML = `
        <div class="bg-gray-800 rounded-lg shadow-md p-6 text-center">
            <div class="text-4xl font-bold text-blue-400">${rows.length}</div>
            <div class="text-gray-300 mt-2">${currentScope === 'best' ? 'Participants shown' : 'Submissions shown'}</div>
        </div>
        <div class="bg-gray-800 rounded-lg shadow-md p-6 text-center">
            <div class="text-4xl font-bold text-green-400">${participants}</div>
            <div class="text-gray-300 mt-2">Participants</div>
        </div>
        <div class="bg-gray-800 rounded-lg shadow-md p-6 text-center">
            <div class="text-3xl font-bold ${METRIC_COLORS[currentMetric]}">${best ? fmt(best[currentMetric], 4) : '—'}</div>
            <div class="text-gray-300 mt-2">Best ${METRIC_LABELS[currentMetric]}</div>
        </div>
        <div class="bg-gray-800 rounded-lg shadow-md p-6 text-center">
            <div class="text-3xl font-bold text-gray-400">${best ? fmt(best[other], 4) : '—'}</div>
            <div class="text-gray-300 mt-2">${METRIC_LABELS[other]} of leader</div>
        </div>`;
}

function refresh() {
    const rows = visibleRows();
    document.getElementById('board').innerHTML = renderBoard(rows);
    renderStats(rows);

    const total = data[currentSplit].length;
    const noun = currentScope === 'best' ? 'participants' : 'submissions';
    document.getElementById('filterCount').textContent =
        total ? `Showing ${rows.length} ${noun} of ${total} scored submissions` : '';
}

/* ---------------------------------------------------------------------------
   Toggles
--------------------------------------------------------------------------- */
const TAB_ON  = 'px-6 py-3 text-white font-semibold border-b-2 border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500 rounded-t';
const TAB_OFF = 'px-6 py-3 text-gray-400 font-semibold border-b-2 border-transparent focus:outline-none focus:ring-2 focus:ring-blue-500 rounded-t hover:text-white';
const SEG_ON  = 'px-3 py-1.5 text-sm bg-blue-600 text-white focus:outline-none focus:ring-2 focus:ring-inset focus:ring-blue-400';
const SEG_OFF = 'px-3 py-1.5 text-sm text-gray-300 hover:text-white focus:outline-none focus:ring-2 focus:ring-inset focus:ring-blue-500';

function paintToggles() {
    document.getElementById('tab-rmse').className = currentMetric === 'rmse' ? TAB_ON : TAB_OFF;
    document.getElementById('tab-mae').className  = currentMetric === 'mae'  ? TAB_ON : TAB_OFF;

    document.getElementById('split-validate').className = currentSplit === 'validate' ? SEG_ON : SEG_OFF;
    document.getElementById('split-final').className    = (currentSplit === 'final' ? SEG_ON : SEG_OFF) + ' border-l border-gray-600';

    document.getElementById('scope-best').className = currentScope === 'best' ? SEG_ON : SEG_OFF;
    document.getElementById('scope-all').className  = (currentScope === 'all' ? SEG_ON : SEG_OFF) + ' border-l border-gray-600';
}

function showTab(metric) { currentMetric = metric; paintToggles(); refresh(); }
function setSplit(split) { currentSplit = split;  paintToggles(); refresh(); }
function setScope(scope) { currentScope = scope;  paintToggles(); refresh(); }

function clearFilters() {
    ['filterParticipant', 'filterTier', 'filterSub'].forEach(id => {
        document.getElementById(id).value = '';
    });
    refresh();
}

['filterParticipant', 'filterTier', 'filterSub'].forEach(id => {
    document.getElementById(id).addEventListener('input', refresh);
});

/* ---------------------------------------------------------------------------
   Loading
--------------------------------------------------------------------------- */
function loadAll() {
    const splits = Object.keys(SPLIT_URLS);
    let loaded = 0;
    function done() {
        if (++loaded === splits.length) {
            document.getElementById('loading').style.display = 'none';
            refresh();
            updateTimestamp();
        }
    }
    for (const split of splits) {
        Papa.parse(SPLIT_URLS[split] + '?t=' + Date.now(), {
            download: true, header: true,
            complete(r) {
                data[split] = r.data.filter(row => row.participant_id && row.rmse);
                splitLoaded[split] = true;
                done();
            },
            error(e) {
                // A missing final ranking is expected until final submissions land.
                if (split === 'final') {
                    data.final = [];
                    splitLoaded.final = true;
                } else {
                    showError('Could not load ' + split + ' ranking: ' + e.message);
                    splitLoaded[split] = true;
                }
                done();
            }
        });
    }
}

function updateTimestamp() {
    document.getElementById('lastUpdate').textContent = 'Last updated: ' + new Date().toLocaleString('en-GB');
}
function showError(msg) {
    document.getElementById('errorMessage').textContent = msg;
    document.getElementById('error').classList.remove('hidden');
}

paintToggles();
setInterval(loadAll, 5 * 60 * 1000);
loadAll();
</script>
</body>
</html>
